name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate package
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Lint PHP
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Audit dependencies
        run: |
          if php -r '$lock = json_decode(file_get_contents("composer.lock"), true); exit(count($lock["packages"] ?? []) + count($lock["packages-dev"] ?? []) > 0 ? 0 : 1);'; then
            composer audit --locked --no-interaction
          else
            echo "No third-party dependencies to audit."
          fi
